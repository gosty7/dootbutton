<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button</title>
    <style>
        body { background-color: #121212; color: #f5f5f7; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        .counter-text { color: #86868b; margin-bottom: 20px; font-weight: 600; }
        .btn-container { cursor: pointer; transition: transform 0.2s; }
        .btn-container img { max-width: 260px; }
        .active { transform: scale(0.95); }
        .form-container { margin-top: 30px; width: 300px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #dfc19b; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>The Doot Button</h1>
    <div class="counter-text" id="dootCounter">Loading...</div>
    
    <div class="btn-container" id="trigger">
        <img src="dootup.png" id="dootImage" alt="Doot Button">
    </div>

    <div class="form-container">
        <form id="newsletterForm">
            <input type="email" name="Email" placeholder="Your email" required>
            <button type="submit">Join Waitlist</button>
        </form>
    </div>

    <audio id="in" src="dootclickin.wav"></audio>
    <audio id="out" src="dootclickout.wav"></audio>

    <script>
        const img = document.getElementById('dootImage');
        const trigger = document.getElementById('trigger');
        const counter = document.getElementById('dootCounter');
        const SCRIPT_URL = 'PASTE_YOUR_URL_HERE';

        // Load Count
        fetch(SCRIPT_URL + '?type=get').then(r => r.text()).then(t => counter.innerText = t + " Total Doots");

        // Doot Logic
        trigger.addEventListener('mousedown', () => {
            img.src = 'dootdown.png';
            document.getElementById('in').play();
        });

        window.addEventListener('mouseup', () => {
            if (img.src.includes('dootdown.png')) {
                img.src = 'dootup.png';
                document.getElementById('out').play();
                const cur = parseInt(counter.innerText) || 0;
                counter.innerText = (cur + 1) + " Total Doots";
                fetch(SCRIPT_URL + '?type=doot');
            }
        });

        // Email Logic
        document.getElementById('newsletterForm').addEventListener('submit', (e) => {
            e.preventDefault();
            fetch(SCRIPT_URL, { method: 'POST', body: new FormData(e.target)});
            alert("Thanks!");
        });
    </script>
</body>
</html>
