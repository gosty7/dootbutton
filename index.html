<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.25, maximum-scale=5.0">
    <title>The Doot Button</title>
    
    <link rel="icon" type="image/png" href="favicon-96x96.png">

    <style>
        /* Base sizing remains at 115% for added readability */
        * { box-sizing: border-box; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            font-size: 115%; }

        body { background-color: #000000; color: #f5f5f7; overflow-x: hidden; }

        #top { scroll-margin-top: 100px; }

        /* Header */
        header { position: fixed; top: 0; width: 100%; padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .home-btn { font-weight: 800; letter-spacing: -0.04em; font-size: 1.25rem; color: #f5f5f7; text-decoration: none; transition: color 0.2s; cursor: pointer; }
        .home-btn:hover { color: #dfc19b; }
        
        .nav-btn { background: #dfc19b; color: #000; padding: 10px 20px; border-radius: 25px; font-size: 0.8rem; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }

        /* Hero */
        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 180px 30px; text-align: center; }
        h1 { font-size: 3.5rem; margin-bottom: 20px; letter-spacing: -0.04em; }
        p { color: #86868b; margin-bottom: 40px; font-size: 1.3rem; }

        /* Button Animation */
        .interactive-button-container { margin: 30px 0; cursor: pointer; user-select: none; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .interactive-button-container img { max-width: 360px; width: 100%; height: auto; 
            -webkit-user-drag: none; 
            user-select: none; 
            -webkit-user-select: none; }
        .doot-active { transform: scale(0.95) !important; }

        /* Waitlist & Pulse */
        .cta-container { width: 100%; max-width: 420px; margin-top: 40px; padding: 3px; border-radius: 16px; }
        .pulse-border { border: 2px solid transparent; animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { border-color: rgba(255, 0, 0, 0); }
            50% { border-color: rgba(255, 50, 50, 0.6); }
            100% { border-color: rgba(255, 0, 0, 0); }
        }

        .premium-input { width: 100%; padding: 20px; border-radius: 14px; border: 1px solid #333; background: #111; color: white; outline: none; font-size: 1.1rem; margin-bottom: 20px; }
        .action-btn { width: 100%; background: #dfc19b; border: none; padding: 20px; border-radius: 14px; font-weight: 700; font-size: 1.1rem; color: #000; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
        
        #successMessage { display: none; color: #fff; font-weight: 400; font-size: 1.1rem; padding: 20px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div id="top"></div>

    <header>
        <a href="#" class="home-btn">Doot Button</a>
        <a href="#reserve" class="nav-btn">Join Waitlist</a>
    </header>

    <section class="hero">
        <h1>The Doot Button</h1>
        <p>One button. One sound. Infinite satisfaction.</p>

        <div class="interactive-button-container" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button">
        </div>

        <div class="cta-container pulse-border" id="reserve">
            <form id="newsletterForm">
                <input type="email" name="Email" class="premium-input" placeholder="Your preferred email address" required>
                <button type="submit" class="action-btn" id="submitBtn">Join Waitlist</button>
            </form>
            <div id="successMessage">
                <span id="statusText">Joining waitlist...</span>
            </div>
        </div>
    </section>

    <audio id="dootInAudio" src="dootclickin.wav"></audio>
    <audio id="dootOutAudio" src="dootclickout.wav"></audio>

    <script>
        const buttonImg = document.getElementById('dootImage');
        const dootTrigger = document.getElementById('dootTrigger');
        const dootInAudio = document.getElementById('dootInAudio');
        const dootOutAudio = document.getElementById('dootOutAudio');
        const form = document.getElementById('newsletterForm');
        const successMsg = document.getElementById('successMessage');
        const statusText = document.getElementById('statusText');

        const scriptURL = 'https://script.google.com/macros/s/AKfycbyaCH6C-cE__2SHdL2fa4wtvedPI0UAZCurVXHHevk1TXn8lvLV58exu3oCOHlvsvhS/exec';

        // Sound Interaction
        function pressButton() { dootTrigger.classList.add('doot-active'); buttonImg.src = 'dootdown.png'; dootOutAudio.pause(); dootOutAudio.currentTime = 0; dootInAudio.currentTime = 0; dootInAudio.play(); }
        function releaseButton() { dootTrigger.classList.remove('doot-active'); if (buttonImg.src.includes('dootdown.png')) { buttonImg.src = 'dootup.png'; dootInAudio.pause(); dootInAudio.currentTime = 0; dootOutAudio.currentTime = 0; dootOutAudio.play(); } }

        buttonImg.addEventListener('mousedown', pressButton);
        window.addEventListener('mouseup', releaseButton);
        buttonImg.addEventListener('mouseleave', releaseButton); 
        
        buttonImg.addEventListener('touchstart', (e) => { e.preventDefault(); pressButton(); }, {passive: false});
        buttonImg.addEventListener('touchend', releaseButton);
        buttonImg.addEventListener('touchcancel', releaseButton);

        // Form Logic
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            form.style.display = 'none'; 
            successMsg.style.display = 'block';
            statusText.textContent = "Joining waitlist...";
            setTimeout(() => {
                statusText.textContent = "Thanks for Joining the Waitlist. Expect More Info Soon!";
                fetch(scriptURL, { method: 'POST', body: new FormData(form)});
            }, 1200); 
        });
    </script>
</body>
</html>
