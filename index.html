<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased; }
        body { background-color: #000000; color: #f5f5f7; overflow-x: hidden; }

        /* Header */
        header { position: fixed; top: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 1.1rem; }
        .nav-btn { background: #dfc19b; color: #000; padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }

        /* Hero */
        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 20px; text-align: center; }
        h1 { font-size: 4rem; margin-bottom: 15px; letter-spacing: -0.04em; }
        p { color: #86868b; margin-bottom: 40px; font-size: 1.2rem; }

        /* The Button */
        .interactive-button-container { margin: 20px 0; cursor: pointer; user-select: none; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .interactive-button-container img { max-width: 320px; width: 100%; height: auto; }
        .interactive-button-container:active { transform: scale(0.95); }

        /* Waitlist Container */
        .cta-container { width: 100%; max-width: 380px; margin-top: 40px; }
        .premium-input { width: 100%; padding: 16px 20px; border-radius: 12px; border: 1px solid #333; background: #111; color: white; outline: none; font-size: 1rem; margin-bottom: 15px; transition: border 0.3s; }
        .premium-input:focus { border: 1px solid #dfc19b; }
        .action-btn { width: 100%; background: #dfc19b; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1rem; color: #000; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: background 0.3s; }
        .action-btn:hover { background: #c5a682; }

        /* Success Message */
        #successMessage { display: none; color: #fff; font-weight: 400; font-size: 1rem; padding: 20px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Doot Button</div>
        <!-- Pointed to #reserve for smooth scroll -->
        <a href="#reserve" class="nav-btn">Join Waitlist</a>
    </header>

    <section class="hero">
        <h1>The Doot Button</h1>
        <p>One button. One sound. Infinite satisfaction.</p>

        <div class="interactive-button-container" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button">
        </div>

        <div class="cta-container" id="reserve">
            <form id="newsletterForm">
                <input type="email" name="Email" class="premium-input" placeholder="Your preferred email address" required>
                <button type="submit" class="action-btn" id="submitBtn">Join Waitlist</button>
            </form>
            <div id="successMessage">
                <span id="statusText">Joining waitlist...</span>
            </div>
        </div>
    </section>

    <audio id="dootInAudio" src="dootclickin.wav"></audio>
    <audio id="dootOutAudio" src="dootclickout.wav"></audio>

    <script>
        const buttonImg = document.getElementById('dootImage');
        const dootInAudio = document.getElementById('dootInAudio');
        const dootOutAudio = document.getElementById('dootOutAudio');
        const form = document.getElementById('newsletterForm');
        const successMsg = document.getElementById('successMessage');
        const statusText = document.getElementById('statusText');

        const scriptURL = 'https://script.google.com/macros/s/AKfycbyaCH6C-cE__2SHdL2fa4wtvedPI0UAZCurVXHHevk1TXn8lvLV58exu3oCOHlvsvhS/exec';

        // Sound Interaction
        function pressButton() { buttonImg.src = 'dootdown.png'; dootInAudio.currentTime = 0; dootInAudio.play(); }
        function releaseButton() { if (buttonImg.src.includes('dootdown.png')) { buttonImg.src = 'dootup.png'; dootOutAudio.currentTime = 0; dootOutAudio.play(); } }

        buttonImg.addEventListener('mousedown', pressButton);
        window.addEventListener('mouseup', releaseButton);
        buttonImg.addEventListener('touchstart', (e) => { e.preventDefault(); pressButton(); });
        buttonImg.addEventListener('touchend', releaseButton);

        // Submission Logic
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            form.style.display = 'none'; 
            successMsg.style.display = 'block';
            
            statusText.textContent = "Joining waitlist...";
            
            setTimeout(() => {
                statusText.textContent = "Thanks for Joining the Waitlist. Expect More Info Soon!";
                fetch(scriptURL, { method: 'POST', body: new FormData(form)});
            }, 1200); 
        });
    </script>
</body>
</html>
