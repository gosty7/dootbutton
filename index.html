<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { background-color: #000000; color: #f5f5f7; overflow-x: hidden; }
        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .interactive-button-container { margin: 40px 0; cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .interactive-button-container img { max-width: 320px; width: 100%; height: auto; }
        .cta-container { width: 100%; max-width: 420px; margin-top: 40px; }
        .email-capture-wrapper { display: flex; gap: 10px; }
        .premium-input { flex: 1; padding: 14px 20px; border-radius: 25px; border: 1px solid #333; background: #111; color: white; }
        .action-btn { background: #dfc19b; border: none; padding: 14px 25px; border-radius: 25px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <section class="hero">
        <h1>The Doot Button</h1>
        <div class="interactive-button-container" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button">
        </div>
        <div class="cta-container">
            <form id="newsletterForm" class="email-capture-wrapper">
                <input type="email" name="Email" class="premium-input" placeholder="Enter your email" required>
                <button type="submit" class="action-btn" id="submitBtn">Join Waitlist</button>
            </form>
            <p id="successMessage" style="display:none; color: #dfc19b; margin-top: 20px;">✓ You're on the list.</p>
        </div>
    </section>
    <audio id="dootInAudio" src="dootclickin.wav"></audio>
    <audio id="dootOutAudio" src="dootclickout.wav"></audio>
    <script>
        const form = document.getElementById('newsletterForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyaCH6C-cE__2SHdL2fa4wtvedPI0UAZCurVXHHevk1TXn8lvLV58exu3oCOHlvsvhS/exec';
        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(() => { form.style.display = 'none'; document.getElementById('successMessage').style.display = 'block'; });
        });
        const img = document.getElementById('dootImage');
        img.addEventListener('mousedown', () => { img.src='dootdown.png'; document.getElementById('dootInAudio').play(); });
        window.addEventListener('mouseup', () => { if(img.src.includes('dootdown.png')){ img.src='dootup.png'; document.getElementById('dootOutAudio').play(); }});
    </script>
</body>
</html>
