<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOT BUTTON — Luxury is Coming</title>
    <style>
        /* --- Reset & Core Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- Sticky Top Header --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 20px;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* --- Email Form Styling --- */
        .email-form {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        @media (min-width: 600px) {
            .email-form {
                width: auto;
            }
        }

        .email-input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .email-input:focus {
            border-color: #ff3b30; /* Classic premium red accent */
        }

        .submit-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background-color: #ffffff;
            color: #000000;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .submit-btn:hover {
            background-color: #e5e5e5;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* --- Main Content Section --- */
        main {
            margin-top: 120px; /* Offset for sticky header */
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (min-width: 600px) {
            main {
                margin-top: 80px;
            }
        }

        .intro {
            text-align: center;
            max-width: 600px;
            margin: 60px 0;
        }

        .intro h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .intro p {
            color: #8e8e93;
            font-size: 1.2rem;
            font-weight: 300;
        }

        /* --- Image Gallery --- */
        .gallery {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-bottom: 80px;
        }

        .gallery-item {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #1c1c1e;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* --- Bottom Call-To-Action --- */
        .bottom-cta {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, #0a0a0a 0%, #121212 100%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bottom-cta h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 0.05em;
        }

        .bottom-cta p {
            color: #8e8e93;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .bottom-cta .email-form {
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Doot Button</div>
        <form class="email-form newsletter-form">
            <input type="email" class="email-input" placeholder="Enter your email" required>
            <button type="submit" class="submit-btn">Join Batch One</button>
        </form>
    </header>

    <main>
        <section class="intro">
            <h1>DOOT</h1>
            <p>Pinnacle performance. Luxury is coming.</p>
        </section>

        <section class="gallery">
            <div class="gallery-item">
                <img src="concept1.jpg" alt="Doot Button Concept - Marble Setting">
            </div>
            <div class="gallery-item">
                <img src="concept2.jpg" alt="Doot Button Concept - Detail Angle">
            </div>
        </section>
    </main>

    <section class="bottom-cta">
        <h2>Secure Your Spot</h2>
        <p>Be the first to know when the initial production run of 500 units goes live. No spam, only luxury.</p>
        <form class="email-form newsletter-form">
            <input type="email" class="email-input" placeholder="Enter your email" required>
            <button type="submit" class="submit-btn">Join Mailing List</button>
        </form>
    </section>

    <script>
        document.querySelectorAll('.newsletter-form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const emailInput = this.querySelector('.email-input').value;
                
                // For now, this alerts the entry. 
                // Connect this to your chosen backend later (e.g., Formspree, Mailchimp, or Loop)
                alert(`Thank you! ${emailInput} has been added to the Doot Button waitlist.`);
                
                // Clear inputs across all identical forms
                document.querySelectorAll('.email-input').forEach(input => input.value = '');
            });
        });
    </script>

</body>
</html>
