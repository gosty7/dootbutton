<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button — Simplicity. Perfected.</title>
    <style>
        /* --- Core Reset & Styles --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { background-color: #000000; color: #f5f5f7; overflow-x: hidden; }

        /* --- Sticky Header --- */
        header { position: fixed; top: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .logo { font-weight: 600; letter-spacing: -0.01em; }
        .nav-btn { background: #dfc19b; color: #000; padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-decoration: none; }

        /* --- Hero --- */
        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; text-align: center; }
        h1 { font-size: 4rem; margin-bottom: 10px; }
        
        /* --- Interactive Button --- */
        .interactive-button-container { margin: 40px 0; cursor: pointer; transition: transform 0.1s; }
        .interactive-button-container img { max-width: 300px; width: 100%; height: auto; }
        .interactive-button-container:active { transform: scale(0.98); }

        /* --- Form --- */
        .cta-container { width: 100%; max-width: 400px; margin-top: 50px; }
        .email-capture-wrapper { display: flex; gap: 10px; }
        .premium-input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #333; background: #111; color: white; }
        .action-btn { background: #dfc19b; border: none; padding: 12px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Doot Button</div>
        <a href="#reserve" class="nav-btn">Buy Now</a>
    </header>

    <section class="hero">
        <h1>The Doot Button</h1>
        <p>One button. One sound. Infinite satisfaction.</p>

        <div class="interactive-button-container" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button">
        </div>
        <p>Tap and hold to doot.</p>

        <div class="cta-container" id="reserve">
            <form class="email-capture-wrapper" id="newsletterForm">
                <input type="email" class="premium-input" placeholder="Enter your email" required id="emailInput">
                <button type="submit" class="action-btn" id="submitBtn">Join Waitlist</button>
            </form>
        </div>
    </section>

    <audio id="dootAudio" src="your-doot-sound.mp3"></audio>

    <script>
        const buttonImg = document.getElementById('dootImage');
        const dootAudio = document.getElementById('dootAudio');

        // States
        const imgUp = 'dootup.png';
        const imgDown = 'dootdown.png';

        function pressButton() {
            buttonImg.src = imgDown;
            dootAudio.currentTime = 0;
            dootAudio.play().catch(e => console.log("Waiting for user interaction"));
        }

        function releaseButton() {
            buttonImg.src = imgUp;
        }

        // Event Listeners
        buttonImg.addEventListener('mousedown', pressButton);
        window.addEventListener('mouseup', releaseButton);
        
        buttonImg.addEventListener('touchstart', (e) => { e.preventDefault(); pressButton(); });
        buttonImg.addEventListener('touchend', releaseButton);

        // Newsletter Form
        document.getElementById('newsletterForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Added to the list!");
            document.getElementById('emailInput').value = '';
        });
    </script>
</body>
</html>
