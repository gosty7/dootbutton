<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; font-size: 115%; }
        body { background-color: #121212; color: #f5f5f7; overflow-x: hidden; }
        .pop-in { animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        header { position: fixed; top: 0; width: 100%; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .home-btn { display: flex; align-items: center; text-decoration: none; }
        .home-btn img { height: 35px; width: auto; }
        .nav-btn { background: #dfc19b; color: #000; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; cursor: pointer; text-decoration: none; }
        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 120px 25px 40px 25px; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 12px; }
        .hint-text { color: #dfc19b; font-weight: 600; font-size: 1rem; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; }
        p { color: #86868b; margin-bottom: 30px; font-size: 1.1rem; }
        .interactive-button-container { margin: 10px 0; cursor: pointer; transition: transform 0.2s ease; }
        .interactive-button-container img { max-width: 260px; width: 100%; height: auto; -webkit-user-drag: none; }
        .doot-active { transform: scale(0.95) !important; }
        /* NEW: Counter Styling */
        #dootCounter { margin: 15px 0 25px 0; color: #dfc19b; font-weight: 700; font-size: 1.5rem; letter-spacing: 0.05rem; }
        .cta-container { width: 100%; max-width: 320px; margin-top: 30px; }
        .premium-input { width: 100%; padding: 12px; border-radius: 10px; background: #1a1a1a; color: white; margin-bottom: 10px; font-size: 1rem; border: 2px solid transparent; animation: pulse-red 2s infinite; outline: none; }
        @keyframes pulse-red { 0% { border-color: rgba(255, 50, 50, 0.2); } 50% { border-color: rgba(255, 50, 50, 0.6); } 100% { border-color: rgba(255, 50, 50, 0.2); } }
        .action-btn { width: 100%; background: #dfc19b; border: none; padding: 12px; border-radius: 10px; font-weight: 700; color: #000; cursor: pointer; font-size: 1rem; }
        #successMessage { display: none; padding: 12px; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>
    <header>
        <a href="#" class="home-btn"><img src="favicon.png" alt="Doot Logo"></a>
        <a href="#reserve" class="nav-btn">Join Waitlist</a>
    </header>

    <section class="hero">
        <h1>The Doot Button</h1>
        <p>One button. One sound. Infinite satisfaction.</p>
        <div class="hint-text">Tap to Doot</div>
        <div class="interactive-button-container pop-in" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button">
        </div>
        
        <div id="dootCounter">Connecting...</div>

        <div class="cta-container" id="reserve">
            <form id="newsletterForm">
                <input type="email" id="emailInput" class="premium-input" placeholder="Your email" required>
                <button type="submit" class="action-btn">Join Waitlist</button>
            </form>
            <div id="successMessage"><span id="statusText">Thanks for Joining!</span></div>
        </div>
    </section>

    <audio id="dootInAudio" src="dootclickin.wav"></audio>
    <audio id="dootOutAudio" src="dootclickout.wav"></audio>

    <script>
        const buttonImg = document.getElementById('dootImage');
        const dootTrigger = document.getElementById('dootTrigger');
        const dootInAudio = document.getElementById('dootInAudio');
        const dootOutAudio = document.getElementById('dootOutAudio');
        const counterDisplay = document.getElementById('dootCounter');

        // Initial Load: Ask Google for the current total
        window.onload = () => {
            google.script.run.withSuccessHandler(val => counterDisplay.innerText = val + " Total Doots").getSheetValue();
        };

        function pressButton() { 
            dootTrigger.classList.add('doot-active'); 
            buttonImg.src = 'dootdown.png'; 
            dootOutAudio.pause(); dootOutAudio.currentTime = 0; 
            dootInAudio.currentTime = 0; dootInAudio.play(); 
        }

        function releaseButton() { 
            dootTrigger.classList.remove('doot-active'); 
            if (buttonImg.src.includes('dootdown.png')) { 
                buttonImg.src = 'dootup.png'; 
                dootInAudio.pause(); dootInAudio.currentTime = 0; 
                dootOutAudio.currentTime = 0; dootOutAudio.play(); 
                
                // Increment and update UI via secure Google tunnel
                google.script.run.withSuccessHandler(val => counterDisplay.innerText = val + " Total Doots").incrementCount();
            } 
        }

        buttonImg.addEventListener('mousedown', pressButton);
        window.addEventListener('mouseup', releaseButton);
        buttonImg.addEventListener('mouseleave', releaseButton); 
        buttonImg.addEventListener('touchstart', (e) => { e.preventDefault(); pressButton(); }, {passive: false});
        buttonImg.addEventListener('touchend', releaseButton);
        buttonImg.addEventListener('touchcancel', releaseButton);

        document.getElementById('newsletterForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            document.getElementById('newsletterForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            google.script.run.saveEmail(email);
        });
    </script>
</body>
</html>
