<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            font-size: 115%; }

        body { background-color: #121212; color: #f5f5f7; overflow-x: hidden; }

        header { 
            position: fixed; top: 0; width: 100%; padding: 25px 40px; 
            display: flex; justify-content: space-between; align-items: center; 
            background: transparent; z-index: 100;
        }
        
        .home-btn { display: flex; align-items: center; text-decoration: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .home-btn img { height: 40px; width: auto; }
        
        .nav-btn { 
            background: #dfc19b; color: #000; padding: 10px 20px; border-radius: 25px; 
            font-size: 0.9rem; font-weight: 800; text-transform: uppercase; 
            cursor: pointer; text-decoration: none; box-shadow: 0 4px 15px rgba(223, 193, 155, 0.2);
            transition: all 0.3s ease;
        }
        .nav-btn:hover { background: #fff; transform: translateY(-2px); }

        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 25px 40px 25px; text-align: center; }
        
        h1 { font-size: 3.5rem; margin-bottom: 15px; letter-spacing: -0.02em; }
        .hint-text { color: #dfc19b; font-weight: 700; font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.2em; }
        p { color: #86868b; margin-bottom: 40px; font-size: 1.2rem; }

        .interactive-button-container { margin: 10px 0; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .interactive-button-container img { max-width: 280px; width: 100%; height: auto; -webkit-user-drag: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        .doot-active { transform: scale(0.92) !important; }

        .cta-container { width: 100%; max-width: 320px; margin-top: 40px; }
        .premium-input { width: 100%; padding: 15px; border-radius: 12px; background: #1a1a1a; color: white; margin-bottom: 12px; font-size: 1.1rem; border: 1px solid #333; outline: none; transition: border 0.3s; }
        .premium-input:focus { border-color: #dfc19b; }
        .action-btn { width: 100%; background: #dfc19b; border: none; padding: 15px; border-radius: 12px; font-weight: 800; color: #000; cursor: pointer; font-size: 1.1rem; }
        #successMessage { display: none; padding: 15px; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="home-btn"><img src="favicon.png" alt="Doot Logo"></a>
        <a href="#reserve" class="nav-btn">Join Waitlist</a>
    </header>

    <section class="hero">
        <h1>The Doot Button</h1>
        <p>One button. One sound. Infinite satisfaction.</p>
        
        <div class="hint-text">Tap to Doot</div>
        <div class="interactive-button-container" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button">
        </div>

        <div class="cta-container" id="reserve">
            <form id="newsletterForm">
                <input type="email" name="Email" class="premium-input" placeholder="Your email address" required>
                <button type="submit" class="action-btn">Join Waitlist</button>
            </form>
            <div id="successMessage">
                <span id="statusText">Joining waitlist...</span>
            </div>
        </div>
    </section>

    <audio id="dootInAudio" src="dootclickin.wav"></audio>
    <audio id="dootOutAudio" src="dootclickout.wav"></audio>

    <script>
        const buttonImg = document.getElementById('dootImage');
        const dootTrigger = document.getElementById('dootTrigger');
        const dootInAudio = document.getElementById('dootInAudio');
        const dootOutAudio = document.getElementById('dootOutAudio');
        const form = document.getElementById('newsletterForm');
        const successMsg = document.getElementById('successMessage');

        function pressButton() { 
            dootTrigger.classList.add('doot-active'); 
            buttonImg.src = 'dootdown.png'; 
            dootOutAudio.pause(); dootOutAudio.currentTime = 0; 
            dootInAudio.currentTime = 0; dootInAudio.play(); 
        }

        function releaseButton() { 
            dootTrigger.classList.remove('doot-active'); 
            if (buttonImg.src.includes('dootdown.png')) { 
                buttonImg.src = 'dootup.png'; 
                dootInAudio.pause(); dootInAudio.currentTime = 0; 
                dootOutAudio.currentTime = 0; dootOutAudio.play(); 
            } 
        }

        buttonImg.addEventListener('mousedown', pressButton);
        window.addEventListener('mouseup', releaseButton);
        buttonImg.addEventListener('mouseleave', releaseButton); 
        buttonImg.addEventListener('touchstart', (e) => { e.preventDefault(); pressButton(); }, {passive: false});
        buttonImg.addEventListener('touchend', releaseButton);
        buttonImg.addEventListener('touchcancel', releaseButton);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            form.style.display = 'none'; 
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.textContent = "Thanks for Joining!";
                fetch('https://script.google.com/macros/s/AKfycbyaCH6C-cE__2SHdL2fa4wtvedPI0UAZCurVXHHevk1TXn8lvLV58exu3oCOHlvsvhS/exec', { method: 'POST', body: new FormData(form)});
            }, 1200); 
        });
    </script>
</body>
</html>
