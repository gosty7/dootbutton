<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOT BUTTON — Luxury is Coming</title>
    <style>
        /* --- Reset & Core Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #000000;
            color: #f5f5f7;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        /* --- Sticky Top Header --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 40px;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Classy Email Form Styling --- */
        .email-form {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 380px;
        }

        @media (min-width: 600px) {
            .email-form {
                width: auto;
            }
        }

        .email-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .email-input:focus {
            border-color: rgba(255, 59, 48, 0.8);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.15);
        }

        .email-input::placeholder {
            color: #6e6e73;
        }

        .submit-btn {
            padding: 12px 24px;
            border-radius: 22px;
            border: none;
            background-color: #ffffff;
            color: #000000;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            white-space: nowrap;
        }

        .submit-btn:hover {
            background-color: #f5f5f7;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        /* Success State for JavaScript Interaction */
        .submit-btn.success {
            background-color: #34c759 !important; /* Premium iOS Success Green */
            color: #ffffff !important;
            transform: translateY(0);
            box-shadow: none;
        }

        /* --- Main Content Section --- */
        main {
            margin-top: 140px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (min-width: 600px) {
            main {
                margin-top: 100px;
            }
        }

        .intro {
            text-align: center;
            max-width: 800px;
            margin: 80px 0 100px 0;
        }

        .intro h1 {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 768px) {
            .intro h1 {
                font-size: 3rem;
            }
        }

        .intro p {
            color: #86868b;
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* --- Premium Image Gallery --- */
        .gallery {
            width: 100%;
            max-width: 1080px;
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-bottom: 120px;
        }

        .gallery-item {
            width: 100%;
            border-radius: 28px;
            overflow: hidden;
            background: #121212;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        /* --- Bottom Premium Call-To-Action --- */
        .bottom-cta {
            text-align: center;
            padding: 120px 20px;
            background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .bottom-cta h2 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bottom-cta p {
            color: #86868b;
            font-size: 1.1rem;
            margin-bottom: 40px;
            max-width: 540px;
            line-height: 1.5;
        }

        .bottom-cta .email-form {
            max-width: 440px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Doot Button</div>
        <form class="email-form newsletter-form">
            <input type="email" class="email-input" placeholder="Enter your email" required>
            <button type="submit" class="submit-btn">Join Batch One</button>
        </form>
    </header>

    <main>
        <section class="intro">
            <h1>DOOT</h1>
            <p>Pinnacle performance. Luxury is coming.</p>
        </section>

        <section class="gallery">
            <div class="gallery-item">
                <img src="doot1.png" alt="Doot Button Concept Showcase 1">
            </div>
            <div class="gallery-item">
                <img src="doot2.png" alt="Doot Button Concept Showcase 2">
            </div>
        </section>
    </main>

    <section class="bottom-cta">
        <h2>Secure Your Spot</h2>
        <p>Be the first to know when the initial production run of 500 units goes live. No spam, only luxury.</p>
        <form class="email-form newsletter-form">
            <input type="email" class="email-input" placeholder="Enter your email" required>
            <button type="submit" class="submit-btn">Join Mailing List</button>
        </form>
    </section>

    <script>
        document.querySelectorAll('.newsletter-form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const emailInput = this.querySelector('.email-input');
                const submitBtn = this.querySelector('.submit-btn');
                const originalBtnText = submitBtn.innerText;
                
                // 1. Capture the email value
                const enteredEmail = emailInput.value;
                console.log(`Captured submission for: ${enteredEmail}`);
                
                // 2. Animate the button to a clean success indicator state
                submitBtn.classList.add('success');
                submitBtn.innerText = "✓ Added";
                submitBtn.disabled = true;
                
                // 3. Clear the input seamlessly
                emailInput.value = '';
                emailInput.blur();
                
                // 4. Reset the form interaction smoothly after 3.5 seconds
                setTimeout(() => {
                    submitBtn.classList.remove('success');
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }, 3500);
            });
        });
    </script>

</body>
</html>
