<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 700; font-size: 1.2rem; }
        .nav-btn { background: #dfc19b; color: #000; padding: 8px 20px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-decoration: none; cursor: pointer; }

        .hero { display: flex; flex-direction: column; align-items: center; padding: 100px 20px; text-align: center; }
        
        /* The classic button feel */
        .interactive-button-container { cursor: pointer; margin: 40px 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        .interactive-button-container img { max-width: 300px; width: 100%; transition: transform 0.1s; }
        .interactive-button-container:active img { transform: scale(0.95); }

        .cta-container { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; }
        .email-capture-wrapper { display: flex; gap: 10px; }
        .premium-input { flex: 1; padding: 14px 20px; border-radius: 25px; border: none; background: transparent; color: #fff; outline: none; }
        .action-btn { background: #dfc19b; border: none; padding: 14px 25px; border-radius: 25px; font-weight: 700; color: #000; cursor: pointer; }
        #successMessage { display: none; padding: 15px; color: #dfc19b; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Doot Button</div>
        <a href="#waitlist" class="nav-btn">Buy Now</a>
    </header>

    <main class="hero">
        <h1>The Doot Button</h1>
        
        <div class="interactive-button-container" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button" draggable="false">
        </div>

        <div class="cta-container" id="waitlist">
            <form id="newsletterForm" class="email-capture-wrapper">
                <input type="email" name="Email" class="premium-input" placeholder="Enter your email" required>
                <button type="submit" class="action-btn" id="submitBtn">Join Waitlist</button>
            </form>
            <div id="successMessage">✓ You're on the list.</div>
        </div>
    </main>

    <audio id="dootInAudio" src="dootclickin.wav"></audio>
    <audio id="dootOutAudio" src="dootclickout.wav"></audio>

    <script>
        // Form Logic
        const form = document.getElementById('newsletterForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyaCH6C-cE__2SHdL2fa4wtvedPI0UAZCurVXHHevk1TXn8lvLV58exu3oCOHlvsvhS/exec';
        
        form.addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('submitBtn').disabled = true;
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(() => { form.style.display = 'none'; document.getElementById('successMessage').style.display = 'block'; });
        });

        // Classic Doot Interaction
        const img = document.getElementById('dootImage');
        const inAudio = document.getElementById('dootInAudio');
        const outAudio = document.getElementById('dootOutAudio');

        img.addEventListener('mousedown', () => { img.src='dootdown.png'; inAudio.currentTime = 0; inAudio.play(); });
        window.addEventListener('mouseup', () => { if(img.src.includes('dootdown.png')){ img.src='dootup.png'; outAudio.currentTime = 0; outAudio.play(); }});
        
        img.addEventListener('touchstart', (e) => { img.src='dootdown.png'; inAudio.currentTime = 0; inAudio.play(); });
        img.addEventListener('touchend', () => { img.src='dootup.png'; outAudio.currentTime = 0; outAudio.play(); });
    </script>
</body>
</html>
