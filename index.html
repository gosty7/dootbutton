<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Doot Button</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        .hero { text-align: center; width: 100%; max-width: 500px; padding: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 2rem; letter-spacing: -1px; }

        .interactive-button-container { cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-bottom: 2rem; }
        .interactive-button-container img { max-width: 250px; width: 100%; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        .interactive-button-container:active { transform: scale(0.95); }

        .cta-container { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .email-capture-wrapper { display: flex; gap: 10px; }
        .premium-input { flex: 1; padding: 15px 20px; border-radius: 25px; border: none; background: transparent; color: #fff; outline: none; font-size: 1rem; }
        .action-btn { background: #dfc19b; border: none; padding: 15px 25px; border-radius: 25px; font-weight: 700; color: #000; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
        .action-btn:hover { opacity: 0.9; }

        #successMessage { display: none; padding: 15px; color: #dfc19b; font-weight: 600; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>The Doot Button</h1>
        
        <div class="interactive-button-container" id="dootTrigger">
            <img src="dootup.png" id="dootImage" alt="Doot Button">
        </div>

        <div class="cta-container">
            <form id="newsletterForm" class="email-capture-wrapper">
                <input type="email" name="Email" class="premium-input" placeholder="Enter your email" required>
                <button type="submit" class="action-btn" id="submitBtn">Join Waitlist</button>
            </form>
            <div id="successMessage">✓ You're on the list.</div>
        </div>
    </section>

    <audio id="dootInAudio" src="dootclickin.wav"></audio>
    <audio id="dootOutAudio" src="dootclickout.wav"></audio>

    <script>
        const form = document.getElementById('newsletterForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyaCH6C-cE__2SHdL2fa4wtvedPI0UAZCurVXHHevk1TXn8lvLV58exu3oCOHlvsvhS/exec';

        form.addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('submitBtn').disabled = true;
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(() => { 
                    form.style.display = 'none'; 
                    document.getElementById('successMessage').style.display = 'block'; 
                });
        });

        const img = document.getElementById('dootImage');
        img.addEventListener('mousedown', () => { img.src='dootdown.png'; document.getElementById('dootInAudio').play(); });
        window.addEventListener('mouseup', () => { if(img.src.includes('dootdown.png')){ img.src='dootup.png'; document.getElementById('dootOutAudio').play(); }});
    </script>
</body>
</html>
